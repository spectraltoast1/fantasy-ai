# Weekly in-season cadence — enqueue a refresh job per connected league (V1 · P5 · S4d).
#
# THIS RUNNER NO LONGER RUNS THE PIPELINE. It enqueues, and the Fly worker executes. Before S4d this
# file was the pipeline: checkout, the full application/requirements.txt (polars + numpy), and
# `python -m application.data.serve.weekly_refresh --live` against ONE hardcoded LEAGUE_ID. It had
# never worked — since the Aug 1 season rollover it died at shared/league_resolver.py, because that
# id is a 2025 league and the resolver asks Sleeper for 2026.
#
# What replaced it: `python -m application.api.enqueue_refresh`, which enumerates
# `user_leagues JOIN league_catalog` at the current season and calls `jobs.enqueue(kind='refresh')`
# for each. Three things follow, and they are the point rather than side effects:
#
#   * MY_USERNAME and LEAGUE_ID are RETIRED, not relocated. Every job carries its own league_id, so
#     the is_mine resolver is never reached. One hardcoded league becomes every connected league.
#   * api/requirements.txt, NOT application/requirements.txt. This process enqueues rows; it does
#     not join, compute a spine or write a store. Deliberately the API image's own pin file rather
#     than a third hand-maintained slim list — collectors.yml has one of those and it is already a
#     second thing to keep in step.
#   * STORE_ROLE IS GONE, and not for convenience. It guarded this runner against authoring the
#     shared substrate. `application/api/` may not import `application/data/` — enforced, not
#     observed: check_connect's ONE IMAGE leg fails on any such import across all 21 api modules.
#     Verified at runtime too: the enqueue path loads no application.data module, and in the
#     api-tier venv data_layer is not importable at all (no polars). The flag is dropped because
#     what it guards is unreachable. If anything on this path ever imports data_layer, IT COMES BACK.
#     -> context/appendices/store-boundary.md
#
# SNAPSHOT_BACKEND and the six SUPABASE_* storage secrets went with the pipeline for the same
# reason: this job touches no snapshot store. DATABASE_URL is the only secret it still needs.
#
# Idempotent, and a no-op is the CORRECT outcome here. `enqueue_refresh` skips any league that
# already has a non-terminal job (jobs_active_league_idx is UNIQUE PARTIAL on (league_id, season)
# over non-terminal states), so Wednesday does nothing when Tuesday worked — and that is counted
# and printed separately from an error, because a catch-up cron that alarmed on its own success
# would email every week for ever. The exit code is non-zero only when a league that WAS due could
# not be enqueued.
#
# Telling the three apart WITHOUT reading worker logs (this session's requirement) is the `jobs`
# table: a `kind='refresh'` row in `ready` with a finished_at RAN AND SUCCEEDED; no row for the
# cycle means IT DID NOT RUN; `failed`/`rejected` carries the reason in `error`. What the table
# deliberately does NOT distinguish is "advanced a week" from "was already current" — both are a
# clean `ready`, because weekly_refresh is idempotent by design.
#
# Schedules are UTC. Tue + Wed midday land after Monday-night games and the multi-day stat
# corrections settle (freshness vs stability); Wed is the idempotent catch-up for a missed/failed
# Tue — the collectors' primary+catch-up reliability pattern.

name: Weekly Refresh

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "enumerate and print, enqueue nothing (runs the REAL query)"
        type: boolean
        default: false
      season:
        description: "override the derived current season (testing; the cron never passes it)"
        default: ""
  schedule:
    - cron: "0 15 * * 2"   # Tue 15:00 UTC (~11:00 ET) — primary, after Mon-night + stat corrections
    - cron: "0 15 * * 3"   # Wed 15:00 UTC — idempotent catch-up (no-op if Tue already enqueued)

env:
  # The Supabase Postgres URL — a REPO secret, not a Fly secret. It is the only credential an
  # enqueuer needs: it writes one row per due league to public.jobs and NOTIFYs.
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install API-tier deps (no polars, no numpy — this enqueues, it does not compute)
        run: pip install -r application/api/requirements.txt
      - name: Enqueue a refresh job per connected league
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          SEASON: ${{ inputs.season }}
        run: |
          set -euo pipefail
          args=""
          [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
          [ -n "${SEASON:-}" ] && args="$args --season $SEASON"
          echo "running: enqueue_refresh $args"
          python -m application.api.enqueue_refresh $args
