# Fly.io config for the fantasy-ai app (store-migration go-live, Session 6).
# ONE same-origin app: the multi-stage Dockerfile builds the SPA and serves it plus the
# /api endpoints. Deploy from this directory: `fly deploy` (build context = application/).
app = "fantasy-ai-api"
primary_region = "iad"

[build]
  # Supabase config for the SPA (P5/S1). Build args, not secrets: Vite inlines these at BUILD
  # time, and `fly secrets` only reach the running machine. Committed here on purpose so a bare
  # `fly deploy` is correct — this project has already shipped a merged-but-undeployed change
  # (P0/B3) and a stale bundle (S4a); a deploy that needs a remembered --build-arg would be a
  # third way to break it. Both values are public: the anon key ships in the JS bundle
  # regardless, and this project's Data API is disabled with RLS deny-by-default, so it opens
  # nothing. The service-role key is admin-grade and lives ONLY in application/config.py.
  [build.args]
    VITE_SUPABASE_URL = "https://llanqdqzgncekvybasyd.supabase.co"
    VITE_SUPABASE_ANON_KEY = "REPLACE_ME"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle (cheap); start on request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Liveness probe — DB-free so it doesn't flap if Supabase pauses.
  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
