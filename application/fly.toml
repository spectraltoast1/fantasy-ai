# Fly.io config for the fantasy-ai app (store-migration go-live, Session 6).
# ONE same-origin app: the multi-stage Dockerfile builds the SPA and serves it plus the
# /api endpoints. Deploy from this directory: `fly deploy` (build context = application/).
app = "fantasy-ai-api"
primary_region = "iad"

[build]
  # Supabase config for the SPA (P5/S1). Build args, not secrets: Vite inlines these at BUILD
  # time, and `fly secrets` only reach the running machine. Committed here on purpose so a bare
  # `fly deploy` is correct — this project has already shipped a merged-but-undeployed change
  # (P0/B3) and a stale bundle (S4a); a deploy that needs a remembered --build-arg would be a
  # third way to break it. Both values are public: the PUBLISHABLE key (sb_publishable_…, which
  # replaced the legacy anon JWT) ships in the JS bundle regardless, and this project's Data API
  # is disabled with RLS deny-by-default, so it opens nothing. The SECRET key is admin-grade,
  # is not a JWT, and lives ONLY in application/config.py — never a build arg, since those are
  # readable in image history.
  [build.args]
    VITE_SUPABASE_URL = "https://llanqdqzgncekvybasyd.supabase.co"
    VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_L7TWXDY4KQHYecu78tWnlQ_YlYwZYNW"

# Runtime env for the API. SUPABASE_URL is needed in BOTH places and it is easy to miss the
# second: the build arg above reaches `vite build` only, while the API resolves this at request
# time to derive the JWKS endpoint and the expected token issuer. The image ships no config.py,
# so without this every /api/me returns 503 "auth is not configured" — which the post-deploy
# check caught. Declared here rather than as a Fly secret because it is not secret (it is in
# every URL the browser hits) and a declared value keeps a bare `fly deploy` correct.
# The genuinely secret values (DATABASE_URL, MY_USERNAME, LEAGUE_ID) remain Fly secrets.
#
# DEMO_LEAGUE_ID (P5/S2a) is the ONE public league — the only slice a signed-out visitor can see,
# and the landing page until there is a real one. Declared here for the same reason as above: it
# is not a secret (it is a Sleeper league id), and a declared value keeps a bare `fly deploy`
# correct. Repointing the demo at the anonymized clone is this one line.
#
# CURRENT_SEASON is deliberately ABSENT, and normally stays that way. The season derives from the
# calendar (`settings.current_season`: the year, or the year before it until August 1), so there is
# nothing to configure in the ordinary case.
#
# It is the documented MANUAL LEVER (P5/S2c promoted it from a temporary proof hack): set it to run
# the ownership matrix against deployed code (the corpus tops out at 2025), or to move the rollover
# by hand if the calendar rule ever disagrees with the real season. Set it TEMPORARILY and remove it
# in the same session — a deploy that still carries it is a deploy showing users prior-season
# leagues. Plain [env] rather than a Fly secret on purpose: an override nobody can see is the
# failure mode, and `/health` reports the value AND its source so a stray one cannot hide.
[env]
  SUPABASE_URL = "https://llanqdqzgncekvybasyd.supabase.co"
  DEMO_LEAGUE_ID = "DEMO-2025"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle (cheap); start on request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Liveness probe — DB-free so it doesn't flap if Supabase pauses.
  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
